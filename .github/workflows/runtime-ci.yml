name: Runtime compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Ensure FFmpeg is available on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Ensure FFmpeg is available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:check
      - run: pnpm lint
      - run: pnpm test
