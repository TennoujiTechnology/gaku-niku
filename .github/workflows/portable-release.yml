name: Portable release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Read package version
        id: package
        run: node -e "const fs=require('fs');const version=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+version+'\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:standalone
      - run: pnpm release:portable -- --target=${{ matrix.target }} --output=${{ runner.temp }}/gaku-niku-release
      - name: Test packaged application
        shell: pwsh
        if: runner.os == 'Windows'
        run: pnpm release:smoke -- "${{ runner.temp }}/gaku-niku-release/staging/GakuNiku-v${{ steps.package.outputs.version }}-${{ matrix.target }}"
      - name: Test packaged application
        if: runner.os != 'Windows'
        run: pnpm release:smoke -- "${{ runner.temp }}/gaku-niku-release/staging/GakuNiku-v${{ steps.package.outputs.version }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GakuNiku-v${{ steps.package.outputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/gaku-niku-release/GakuNiku-v${{ steps.package.outputs.version }}-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Read package version
        id: package
        run: node -e "const fs=require('fs');const version=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+version+'\n')"
      - name: Verify tag matches package version
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: GakuNiku-v${{ steps.package.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "GakuNiku $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "GakuNiku $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
